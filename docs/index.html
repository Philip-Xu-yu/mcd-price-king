.btn:hover { background:#B82014; }
.result { margin-top:20px; }

.card { background:#fff; border:2px solid #F0E6D2; border-radius:16px; padding:16px; text-align:center; }

.card .strike { color:#999; text-decoration:line-through; font-size:0.85rem; }
.card .metric { font-size:0.9rem; margin:6px 0; }

.verdict { border:2px dashed var(--mcd-red); border-radius:14px; padding:16px 18px; margin-top:16px; background:#fff; }
.verdict .title { font-weight:800; color:var(--mcd-red); }
.verdict .text { margin-top:6px; font-size:1rem; }
.verdict .tip { color:#888; font-size:0.85rem; margin-top:8px; }
.foot { margin-top:24px; color:#999; font-size:0.8rem; text-align:center; line-height:1.7; }
.tag { display:inline-block; background:var(--mcd-yellow); color:#7A5200; border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:700; }
</style>
</head>

<script>
const DATA = window.MC_SAMPLE || [];
const A = document.getElementById('selA');
const B = document.getElementById('selB');

DATA.forEach((d, i) => {
  const oa = document.createElement('option');
  oa.value = i; oa.textContent = `${d.name}（¥${d.price}）`;
  const ob = document.createElement('option');
  ob.value = i; ob.textContent = `${d.name}（¥${d.price}）`;
  A.appendChild(oa); B.appendChild(ob);
});
B.selectedIndex = 1;

// 麦当劳度量衡（参考价，以门店为准）
const METRIC = [
  { name: '麦乐鸡(5块)', price: 14, protein: 12 },
  { name: '小薯条', price: 13.5, protein: 3 },
  { name: '香芋派', price: 8, protein: 2 },
];

function metricText(saving) {
  if (saving < 1) return `不到一份「香芋派」`;
  let best = null;
  for (const m of METRIC) {
    const n = Math.floor(saving / m.price);
    if (n >= 1) {
      const val = n * m.price;
      if (!best || val > best.val) best = { n, name: m.name, val };
    }
  }
  return best ? `≈ <b>${best.n}</b> 份「${best.name}」` : `不到一份「香芋派」`;
}

function compare() {
  const a = DATA[A.value], b = DATA[B.value];
  if (!a || !b) return;

  const diff = Math.round((a.price - b.price) * 10) / 10;
  const saving = Math.abs(diff);
  const cheaper = diff >= 0 ? 'a' : 'b';

  const reasons = [];
  reasons.push(`${cheaper === 'a' ? 'A' : 'B'} 更省钱（省 ¥${saving}）`);
  if (a.protein !== b.protein) {
    const w = a.protein > b.protein ? 'A' : 'B';
    reasons.push(`${w} 蛋白更多（${Math.max(a.protein,b.protein)}g vs ${Math.min(a.protein,b.protein)}g）`);
  }
  if (a.kcal !== b.kcal) {
    const w = a.kcal < b.kcal ? 'A' : 'B';
    reasons.push(`${w} 热量更低（${Math.min(a.kcal,b.kcal)} vs ${Math.max(a.kcal,b.kcal)} kcal）`);
  }
  const verdict = reasons.length === 1
    ? `选 ${reasons[0][0]} —— ${reasons[0]}`
    : '看你要什么：' + reasons.join('；');

  const pDiff = Math.abs(a.protein - b.protein);
  const pN = Math.round(pDiff / METRIC[0].protein * 10) / 10;

  const card = (x, win) => `
    <div class="card ${win ? 'win' : ''}">
      ${x.image ? `<img src="${x.image}" alt="${x.name}">` : ''}
      <div class="name">${x.name}</div>
      <div class="price">¥${x.price}</div>
      <div class="strike">划线价 ¥${x.original}</div>
      <div class="metric">真实省 <b>¥${x.save}</b> <span class="tag">${x.save >= 0 ? '真优惠' : '注意'}</span></div>
      <div class="metric">热量 <b>${x.kcal} kcal</b></div>
      <div class="metric">蛋白 <b>${x.protein} g</b></div>
    </div>`;

  document.getElementById('result').innerHTML = `
    <h2>② 比价结果</h2>
    <div class="cards">${card(a, cheaper === 'a')}${card(b, cheaper === 'b')}</div>
    <div class="verdict">
      <div class="title">⚖️ 结论</div>
      <div class="text">${verdict}</div>
      <div class="tip">💡 省下的 ¥${saving} ${metricText(saving)}${pN >= 0.1 ? `；蛋白差 ≈ ${pN} 份麦乐鸡(5块)` : ''}</div>
    </div>`;
}

compare(); // 首屏自动展示一组
</script>
